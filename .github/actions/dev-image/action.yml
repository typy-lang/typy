# Builds the dev image of .devcontainer/ for the runner's architecture into
# Docker under the name compose.yaml gives it, so `make dev` finds it and builds
# nothing. Docker's layers come from GitHub's Actions cache, one per
# architecture, which image-cache.yml fills on main; a pull request reads
# main's cache and keeps the layers it builds for its own later runs. The
# workflow's token lets cargo-binstall ask GitHub's API for its binaries.
name: Dev image
description: Build the dev image from the Actions cache
runs:
  using: composite
  steps:
    - name: Read the image name and the runner's user
      id: image
      shell: bash
      run: |
        name="$(sed -n 's/^    image: //p' .devcontainer/compose.yaml | head -1)"
        echo "name=${name}" >> "${GITHUB_OUTPUT}"
        echo "uid=$(id -u)" >> "${GITHUB_OUTPUT}"
        echo "gid=$(id -g)" >> "${GITHUB_OUTPUT}"
    - uses: docker/setup-buildx-action@v4
    - name: Build the dev image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: .devcontainer/Dockerfile
        load: true
        tags: ${{ steps.image.outputs.name }}
        build-args: |
          USER_UID=${{ steps.image.outputs.uid }}
          USER_GID=${{ steps.image.outputs.gid }}
        secrets: |
          github_token=${{ github.token }}
        cache-from: type=gha,scope=dev-${{ runner.arch }}
        cache-to: type=gha,mode=max,scope=dev-${{ runner.arch }}
