# Runs the quality gate and the package check on every pull request, in the
# same dev container and through the same make targets as a developer's
# machine. `main` changes only through pull requests that are up to date and
# pass this job, so a second run after the merge would test the same tree.
# Run by hand, it also runs Miri and fuzzes for 30 minutes, which a release
# needs (NFR-09); CI minutes are spent on whole changes, not on a schedule.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality gate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The dev image, the build and the two coverage builds need more space
      # than the runner leaves free, so unused preinstalled toolchains go.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the dev container
        run: make dev
      - name: Quality gate
        run: make check
      - name: Release archive
        run: make dist
      # After the archive, whose release build of the compiler it reuses.
      - name: Build-time benchmark
        run: make bench

  weekly:
    name: Miri and fuzzing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the dev container
        run: make dev
      - name: Miri
        run: make miri
      - name: Fuzz for 30 minutes
        run: FUZZ_SECONDS=1800 make fuzz
      - name: Keep the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
