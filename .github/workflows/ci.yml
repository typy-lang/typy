# Runs the quality gate and the package check on every pull request, in the
# same dev container and through the same make targets as a developer's
# machine; a pull request of documents alone gets the light run, which
# scripts/ci-changes.sh decides. `main` changes only through pull requests that are up to date and
# pass this job, so a second run after the merge would test the same tree.
# Run by hand, it also runs Miri and fuzzes for 30 minutes, which a release
# needs (NFR-09); CI minutes are spent on whole changes, not on a schedule.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality gate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A pull request that changes only documents that no compiled test
      # reads gets the light run, which checks them without the dev image.
      - name: Find what the pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE}"
          scripts/ci-changes.sh "${BASE}" >> "${GITHUB_OUTPUT}"
      # setup-uv publishes no tag of its major version, so its release is
      # pinned; Dependabot raises it.
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.changes.outputs.light == 'true'
        with:
          version: "0.13.7"
          enable-cache: false
      # The checks of make check that read documents: markdownlint at the
      # version the dev image pins, with the Makefile's globs, the strict site
      # build and its navigation check, the diagrams, ASCII and traceability.
      - name: Check the documents
        if: steps.changes.outputs.light == 'true'
        env:
          DOCS_TOOLS: ${{ runner.temp }}/docs-tools
        run: |
          version="$(sed -n 's/^ARG MARKDOWNLINT_CLI2_VERSION=//p' .devcontainer/Dockerfile)"
          npx --yes "markdownlint-cli2@${version}" "**/*.md" "#.tmp/**" "#target/**" "#dist/**" "#site/**"
          scripts/build-docs.sh
          make diagrams
          scripts/check-diagrams.sh
          scripts/check-ascii.sh
          scripts/check-traceability.sh
      # The build and the two coverage builds need more space than the runner
      # leaves free, so unused preinstalled toolchains go, in the background
      # while the image loads; the quality gate waits for the room.
      - name: Free disk space
        if: steps.changes.outputs.light != 'true'
        run: |
          nohup sh -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch "${RUNNER_TEMP}/disk-freed"' > /dev/null 2>&1 &
      - uses: ./.github/actions/dev-image
        if: steps.changes.outputs.light != 'true'
      - name: Start the dev container
        if: steps.changes.outputs.light != 'true'
        run: make dev
      - name: Wait for the disk space
        if: steps.changes.outputs.light != 'true'
        run: while [ ! -f "${RUNNER_TEMP}/disk-freed" ]; do sleep 2; done
      - name: Quality gate
        if: steps.changes.outputs.light != 'true'
        run: make check
      - name: Release archive
        if: steps.changes.outputs.light != 'true'
        run: make dist
      # After the archive, whose release build of the compiler it reuses.
      - name: Build-time benchmark
        if: steps.changes.outputs.light != 'true'
        run: make bench

  # The tests on an AArch64 host: every unit, integration and conformance test
  # natively, and the conformance suite built for x86-64 under qemu-x86_64
  # (NFR-16, ADR-0051). The coverage, Miri and fuzzing stay on x86-64.
  arm64:
    name: AArch64 tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find what the pull request changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE}"
          scripts/ci-changes.sh "${BASE}" >> "${GITHUB_OUTPUT}"
      - uses: ./.github/actions/dev-image
        if: steps.changes.outputs.light != 'true'
      - name: Start the dev container
        if: steps.changes.outputs.light != 'true'
        run: make dev
      # The runner's 14 GB disk holds the dev image and a build whose debug
      # information is line tables only.
      - name: Unit, integration and conformance tests
        if: steps.changes.outputs.light != 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          NEXTEST_PROFILE: ci
        run: make test
      # The archive for AArch64 hosts, which builds and runs a program itself,
      # so a release finds no new fault in it.
      - name: Release archive
        if: steps.changes.outputs.light != 'true'
        run: make dist

  # The tests on macOS for Apple silicon, natively, without the dev container
  # (NFR-17, ADR-0055): the LLVM that llvm.lock pins, kept in the Actions cache
  # by its SHA-256, the CPython oracles the dev image holds, installed with uv,
  # and `make EXEC= test`, which runs the targets on the runner itself.
  macos:
    name: macOS tests
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find what the pull request changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE}"
          scripts/ci-changes.sh "${BASE}" >> "${GITHUB_OUTPUT}"
      - name: Read the pinned versions
        id: pins
        if: steps.changes.outputs.light != 'true'
        run: |
          lock=.devcontainer/llvm.lock
          version="$(awk '$1 == "version" { print $2 }' "${lock}")"
          name="llvm-${version}-aarch64-apple-darwin"
          {
            echo "llvm=${name}"
            echo "url=$(awk '$1 == "release" { print $2 }' "${lock}")/${name}.tar.zst"
            echo "sha256=$(awk '$1 == "aarch64-apple-darwin" { print $2 }' "${lock}")"
            echo "nextest=$(sed -n 's/^ARG CARGO_NEXTEST_VERSION=//p' .devcontainer/Dockerfile)"
            echo "pythons=$(sed -n 's/^ARG ORACLE_PYTHONS="\(.*\)"$/\1/p' .devcontainer/Dockerfile)"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v5
        id: llvm
        if: steps.changes.outputs.light != 'true'
        with:
          path: ~/.cache/typy-llvm
          key: llvm-${{ steps.pins.outputs.sha256 }}
      - name: Download the pinned LLVM
        if: steps.changes.outputs.light != 'true' && steps.llvm.outputs.cache-hit != 'true'
        env:
          URL: ${{ steps.pins.outputs.url }}
          SHA256: ${{ steps.pins.outputs.sha256 }}
        run: |
          archive="${RUNNER_TEMP}/llvm.tar.zst"
          curl -fsSL --retry 5 --retry-all-errors -o "${archive}" "${URL}"
          echo "${SHA256}  ${archive}" | shasum -a 256 --check --strict
          mkdir -p ~/.cache/typy-llvm
          zstd -d -c "${archive}" | tar -xf - -C ~/.cache/typy-llvm
      - name: Name the pinned LLVM
        if: steps.changes.outputs.light != 'true'
        env:
          LLVM: ${{ steps.pins.outputs.llvm }}
        run: echo "LLVM_SYS_231_PREFIX=${HOME}/.cache/typy-llvm/${LLVM}" >> "${GITHUB_ENV}"
      # setup-uv publishes no tag of its major version, so its release is
      # pinned; Dependabot raises it.
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.changes.outputs.light != 'true'
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install the CPython oracles
        if: steps.changes.outputs.light != 'true'
        env:
          PYTHONS: ${{ steps.pins.outputs.pythons }}
        run: |
          read -r -a versions <<< "${PYTHONS}"
          UV_PYTHON_BIN_DIR="${HOME}/.local/bin" uv python install "${versions[@]}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.light != 'true'
        with:
          tool: cargo-nextest@${{ steps.pins.outputs.nextest }}
      - name: Unit, integration and conformance tests
        if: steps.changes.outputs.light != 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          NEXTEST_PROFILE: ci
        run: make EXEC= test

  weekly:
    name: Miri and fuzzing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the dev container
        run: make dev
      - name: Miri
        run: make miri
      - name: Fuzz for 30 minutes
        run: FUZZ_SECONDS=1800 make fuzz
      - name: Keep the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
