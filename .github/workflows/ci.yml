# Runs the quality gate and the package check on every push to main and every
# pull request, in the same dev container and through the same make targets as
# a developer's machine. Once a week it also runs Miri and fuzzes for 30
# minutes (NFR-09), so a toolchain or dependency change that breaks either is
# found without slowing every commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality gate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The dev image, the build and the two coverage builds need more space
      # than the runner leaves free, so unused preinstalled toolchains go.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start the dev container
        run: make dev
      - name: Quality gate
        run: make check
      - name: Release archive
        run: make dist

  weekly:
    name: Miri and fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Start the dev container
        run: make dev
      - name: Miri
        run: make miri
      - name: Fuzz for 30 minutes
        run: FUZZ_SECONDS=1800 make fuzz
      - name: Keep the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
