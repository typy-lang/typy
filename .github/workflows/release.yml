# Releases the version a tag `vX.Y.Z` names (development guide section 9).
# The build job checks the tag against the version and the changelog, checks
# that the share of the corpus TyPy builds and runs as CPython does has not
# fallen (NFR-24), and builds the release archive for x86-64 hosts; the
# AArch64 job builds the one for AArch64 Linux hosts, and the macOS job the
# one for Macs with Apple silicon. None runs the quality gate again: main
# changes only through pull requests whose latest commit passed it, so the
# tag's tree has. The publish job waits for a maintainer to approve the
# `release` environment, creates the GitHub release from the changelog
# section with the short-lived workflow token, then downloads the archives
# back and runs a program with the x86-64 one. The pages job then publishes
# the release's documentation through pages.yml (DOC-05).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag and the changelog
        run: scripts/check-release.sh "${GITHUB_REF_NAME}" dist/notes.md
      - uses: ./.github/actions/dev-image
      - name: Start the dev container
        run: make dev
      - name: Corpus share (NFR-24)
        run: make corpus-check
      - name: Release archive
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.cdx.json
            dist/notes.md
          if-no-files-found: error

  build-aarch64:
    name: Build for AArch64 hosts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-image
      - name: Start the dev container
        run: make dev
      # The archive's own check builds and runs a program on this host.
      - name: Release archive
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-aarch64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.cdx.json
          if-no-files-found: error

  # The archive for macOS, built natively with the LLVM llvm.lock pins; it
  # builds and runs a program itself (ADR-0055).
  build-macos:
    name: Build for macOS
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-llvm
      - name: Read the pinned tools
        id: pins
        run: echo "about=$(sed -n 's/^ARG CARGO_ABOUT_VERSION=//p' .devcontainer/Dockerfile)" >> "${GITHUB_OUTPUT}"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@${{ steps.pins.outputs.about }}
      - name: Release archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v gtar > /dev/null || brew install gnu-tar
          make EXEC= dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.cdx.json
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, build-aarch64, build-macos]
    runs-on: ubuntu-24.04
    environment: release
    # The OIDC token signs each archive's provenance through Sigstore, so a user verifies
    # it without a key the project keeps (NFR-26).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Every file was uploaded from dist/, which becomes the artifact's root.
      - uses: actions/download-artifact@v8
        with:
          pattern: release*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Verify each archive's provenance
        run: |
          for archive in dist/*.tar.gz; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
          done
      # A version with a suffix, such as 1.0.0-rc.1, is a release candidate.
      - name: Create the release
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag ${prerelease} \
            --title "TyPy ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.cdx.json
      - name: Install the release back and run a program
        run: |
          mkdir check && cd check
          gh release download "${GITHUB_REF_NAME}" --pattern "*.tar.gz*"
          sha256sum --check ./*.sha256
          gh attestation verify ./*-x86_64-unknown-linux-gnu.tar.gz --repo "${GITHUB_REPOSITORY}"
          tar -xzf ./*-x86_64-unknown-linux-gnu.tar.gz
          printf 'print("hello", 1 + 2)\n' > hello.py
          test "$(TYPY_HOME="$PWD/home" ./typy-*/bin/typy run hello.py)" = "hello 3"

  # A release created with the workflow token starts no `release` event, so
  # pages.yml is called here, for the same tag.
  pages:
    name: Documentation
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
