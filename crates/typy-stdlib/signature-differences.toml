# Each difference between a standard library module TyPy gives and typeshed's
# stub of it that TyPy keeps on purpose, with its reason (ADR-0097, ADR-0119).
# scripts/check-stdlib-signatures.py fails on any other difference, and on a
# difference listed here that no longer exists.

[[difference]]
module = "bisect"
names = ["bisect_left", "bisect_right", "insort_left", "insort_right", "bisect", "insort"]
parameter = "key"
reason = "A key function makes the value another type than the items, which needs @overload with type parameters, planned for 0.13 (TYP-35)."
