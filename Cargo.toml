[workspace]
resolver = "3"
members = ["crates/typy-check", "crates/typy-diagnostics", "crates/typy-source"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["typy-lang contributors"]
publish = false

[workspace.dependencies]
camino = "1"
proptest = "1"
tempfile = "3"
typy-diagnostics = { path = "crates/typy-diagnostics" }
typy-source = { path = "crates/typy-source" }
# The parser has no stability promise, so it is pinned to one exact version
# and upgraded on purpose (C-02, ADR-0005).
ruff_python_ast = "=0.0.20"
ruff_python_parser = "=0.0.20"
ruff_text_size = "=0.0.20"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public item has a one-line docstring; error sections would repeat the
# Result type, which already names the error.
missing_errors_doc = "allow"
