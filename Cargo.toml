[workspace]
resolver = "3"
# The fuzz targets need nightly; they are a workspace of their own (NFR-09).
exclude = ["fuzz"]
members = [
    "crates/typy-build",
    "crates/typy-check",
    "crates/typy-cli",
    "crates/typy-codegen",
    "crates/typy-conformance",
    "crates/typy-diagnostics",
    "crates/typy-driver",
    "crates/typy-lower",
    "crates/typy-runtime",
    "crates/typy-source",
    "crates/typy-tyir",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["typy-lang contributors"]
repository = "https://github.com/typy-lang/typy"
publish = false

[workspace.dependencies]
camino = "1"
clap = { version = "4.5", features = ["derive"] }
proptest = "1"
sha2 = "0.10"
tempfile = "3"
typy-diagnostics = { path = "crates/typy-diagnostics" }
typy-source = { path = "crates/typy-source" }
typy-tyir = { path = "crates/typy-tyir" }
typy-check = { path = "crates/typy-check" }
typy-codegen = { path = "crates/typy-codegen" }
typy-build = { path = "crates/typy-build" }
typy-driver = { path = "crates/typy-driver" }
typy-lower = { path = "crates/typy-lower" }
# One LLVM major version per TyPy release (C-03, ADR-0005).
inkwell = { version = "=0.11.0", default-features = false, features = ["llvm23-1", "target-x86", "target-aarch64"] }
# The parser has no stability promise, so it is pinned to one exact version
# and upgraded on purpose (C-02, ADR-0005).
ruff_python_ast = "=0.0.20"
ruff_python_parser = "=0.0.20"
ruff_text_size = "=0.0.20"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public item has a one-line docstring; error sections would repeat the
# Result type, which already names the error.
missing_errors_doc = "allow"

# The runtime archive is linked into every TyPy program; it aborts on panic and
# is optimised for size (ADR-0006, NFR-02).
[profile.runtime]
inherits = "release"
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
