[workspace]
resolver = "3"
members = ["crates/typy-diagnostics"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["typy-lang contributors"]
publish = false

[workspace.dependencies]
proptest = "1"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public item has a one-line docstring; error sections would repeat the
# Result type, which already names the error.
missing_errors_doc = "allow"
