# The compiler version and components every build uses, in the container and
# on a host. Raise the channel together with RUST_VERSION in
# .devcontainer/Dockerfile.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src", "llvm-tools-preview"]
profile = "minimal"
# Each target's runtime archive is built on either host (ADR-0051); musl's
# serves statically linked programs (NFR-01).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
]
