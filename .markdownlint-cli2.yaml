# Prose wraps at 80 columns. Tables and code blocks are exempt because a
# table row or a command cannot be wrapped without breaking it.
config:
  # The changelog repeats "Added" and "Changed" under each release, as Keep a
  # Changelog does, so a heading only has to differ from its siblings.
  MD024:
    siblings_only: true
  MD013:
    line_length: 80
    tables: false
    code_blocks: false
ignores:
  - ".tmp/**"
  - "target/**"
