# The documentation site, https://typy-lang.org, which Zensical builds from
# the Markdown under docs/ (DOC-05, ADR-0050). Every setting here is one that
# Material for MkDocs 9.8 also reads, so either tool builds the site from
# this file. scripts/build-docs.sh builds it in strict mode into site/.
site_name: TyPy 0.8 documentation
site_url: https://typy-lang.org/
site_description: >-
  TyPy compiles a strict, typed subset of standard Python ahead of time to
  native executables and C libraries.
repo_url: https://github.com/typy-lang/typy
repo_name: typy-lang/typy
edit_uri: blob/main/docs/
copyright: Copyright 2026 typy-lang contributors

docs_dir: docs
site_dir: site

# The PlantUML sources stay in the repository; the site shows the SVG
# rendered from each.
exclude_docs: |
  diagrams/*.puml

# A broken link or anchor fails the strict build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  # The system fonts, so a page loads nothing from another host.
  font: false
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to the system's mode

# The accent colours of both schemes, chosen for contrast.
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - What's new:
      - whatsnew/index.md
      - What's new in TyPy 0.8: whatsnew/0.8.md
      - What's new in TyPy 0.7: whatsnew/0.7.md
